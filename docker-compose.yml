services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: log_analyser
      POSTGRES_USER: log_analyser
      POSTGRES_PASSWORD: change_me_for_local_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U log_analyser -d log_analyser"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://log_analyser:change_me_for_local_demo@db:5432/log_analyser
      MAX_UPLOAD_BYTES: 10485760
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
